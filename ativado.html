<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#8f0340" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>iFood Benefícios — Presente liberado</title>
  <meta name="description" content="Seu presente de R$ 35 foi liberado. Comece a usar agora no iFood." />

  <style>
    /* ==================== TIPOGRAFIA TIPO IFOOD ==================== */
    @font-face { font-family: 'TipoiFood Titulos'; src: url('/fonts/TipoiFoodTitulos-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'TipoiFood Titulos'; src: url('/fonts/TipoiFoodTitulos-ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: swap; }
    @font-face { font-family: 'TipoiFood Textos'; src: url('/fonts/TipoiFoodTextos-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'TipoiFood Textos'; src: url('/fonts/TipoiFoodTextos-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'TipoiFood Textos'; src: url('/fonts/TipoiFoodTextos-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }

    :root {
      --gradient-start: #8f0340;
      --gradient-end:   #69022d;
      --primary-color:  #a41d50;
      --success:        #00BC72;
      --success-soft:   #D7F4E5;
      --text-light:     #141414;
      --text-secondary: #666666;
      --border-light:   #ebebeb;
      --bg-white:       #ffffff;
      --bg-light:       #f5f5f5;

      --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
      --sp-6: 24px; --sp-7: 32px; --sp-8: 40px; --sp-9: 48px;

      --font-family-body:    'TipoiFood Textos', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-family-display: 'TipoiFood Titulos', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      font-family: var(--font-family-body);
      background-color: var(--bg-white);
      color: var(--text-light);
      line-height: 1.5;
      overflow-x: hidden;
    }

    button { font-family: inherit; }

    @media (min-width: 481px) {
      body { background-color: #EFEFEF; }
      .container {
        max-width: 480px;
        margin: 0 auto;
        box-shadow: 0 0 24px rgba(0,0,0,0.08);
        min-height: 100vh;
      }
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: var(--bg-white);
    }

    /* ============ HERO de sucesso ============ */
    .success-hero {
      background: linear-gradient(180deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      color: #fff;
      padding: calc(var(--sp-8) + env(safe-area-inset-top)) var(--sp-5) var(--sp-9) var(--sp-5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-4);
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .check-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 188, 114, 0.35);
    }

    .check-circle svg { width: 36px; height: 36px; stroke: #fff; stroke-width: 3; fill: none; }

    .success-hero h1 {
      font-family: var(--font-family-display);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .success-hero p {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      opacity: 0.92;
      max-width: 320px;
    }

    .amount-pill {
      margin-top: var(--sp-2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      font-family: var(--font-family-display);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .amount-pill .label {
      font-family: var(--font-family-body);
      font-weight: 500;
      font-size: 13px;
      opacity: 0.85;
    }

    /* ============ CONTEÚDO ============ */
    .body {
      background: #fff;
      border-radius: 20px 20px 0 0;
      margin-top: -20px;
      padding: var(--sp-7) var(--sp-4) calc(var(--sp-7) + env(safe-area-inset-bottom)) var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-6);
      position: relative;
      z-index: 10;
      animation: slideUp 0.5s ease-out 0.15s both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-family: var(--font-family-display);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .section-sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: -12px;
    }

    /* ============ Lista de opções ============ */
    .options {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    .option-card {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-4);
      background: var(--bg-light);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .option-card:hover { background: #efefef; border-color: #ddd; }
    .option-card:active { transform: scale(0.98); }
    .option-card:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }

    .option-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
    }

    .option-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-title {
      font-family: var(--font-family-display);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-light);
      letter-spacing: -0.01em;
    }

    .option-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .option-card .chev {
      flex-shrink: 0;
      color: var(--primary-color);
      font-size: 20px;
      line-height: 1;
    }

    /* ============ Botão de fechar ============ */
    .close-bar {
      margin-top: var(--sp-4);
      display: flex;
      justify-content: center;
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      padding: 12px 24px;
      border-radius: 999px;
      font-family: var(--font-family-body);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .close-btn:hover { background: var(--bg-light); color: var(--text-light); }
    .close-btn:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ============ HERO ============ -->
    <div class="success-hero">
      <div class="check-circle" aria-hidden="true">
        <svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg>
      </div>
      <h1>Presente liberado!</h1>
      <p>Seu valor já está disponível em 'Comer no iFood'. Aproveite agora pelos atalhos abaixo.</p>
      <div class="amount-pill">
        <span class="label">Valor disponível</span>
        <span>R$ 35,00</span>
      </div>
    </div>

    <!-- ============ BODY ============ -->
    <div class="body">
      <h2 class="section-title">Pra onde você quer ir?</h2>
      <p class="section-sub">Escolha uma opção pra começar a usar seu presente.</p>

      <div class="options">
        <button class="option-card" data-option="saldo" type="button">
          <div class="option-icon" aria-hidden="true">💰</div>
          <div class="option-text">
            <span class="option-title">Ver meu saldo</span>
            <span class="option-desc">Confira seus saldos no iFood Benefícios.</span>
          </div>
          <span class="chev" aria-hidden="true">›</span>
        </button>

        <button class="option-card" data-option="mercado" type="button">
          <div class="option-icon" aria-hidden="true">🛒</div>
          <div class="option-text">
            <span class="option-title">Mercado com desconto</span>
            <span class="option-desc">Compras com até 15% off no app do iFood.</span>
          </div>
          <span class="chev" aria-hidden="true">›</span>
        </button>

        <button class="option-card" data-option="hits" type="button">
          <div class="option-icon" aria-hidden="true">🔥</div>
          <div class="option-text">
            <span class="option-title">iFood Hits</span>
            <span class="option-desc">Restaurantes mais pedidos da sua região.</span>
          </div>
          <span class="chev" aria-hidden="true">›</span>
        </button>
      </div>

      <div class="close-bar">
        <button class="close-btn" id="closeBtn" type="button">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== CONSTANTES ====================
    const VARIANT = 'breakage';
    const PAGE = 'ativado';
    const AMPLITUDE_API_KEY = ''; // mesma key da breakage.html

    /**
     * Mapeamento das opções → deeplinks/rotas.
     * Cada opção declara qual canal Flutter usar e o payload.
     *
     * `channel` aceita:
     *  - 'RedirectToDeepLinkExternal' → abre OUTRO app (ex.: iFood consumer)
     *  - 'RedirectToDeepLinkInternal' → deeplink dentro do MESMO app (iFood Benefícios)
     *  - 'RedirectToRoute'            → rota nomeada interna do iFood Benefícios
     *
     * `target` é o payload literal enviado pro canal. Preencher quando soubermos os URIs reais.
     * Enquanto estiver vazio, o clique só dispara tracking + log.
     */
    const DEEPLINKS = {
      saldo:   { channel: 'RedirectToRoute',            target: '' /* ex.: '/wallet' no iFood Benefícios */ },
      mercado: { channel: 'RedirectToDeepLinkExternal', target: '' /* ex.: 'ifood://market' no app iFood */ },
      hits:    { channel: 'RedirectToDeepLinkExternal', target: '' /* ex.: 'ifood://hits' no app iFood */  }
    };

    // ==================== URL / PLATAFORMA ====================
    const URL_PARAMS = new URLSearchParams(window.location.search);
    const IS_ANDROID = /Android/i.test(navigator.userAgent);

    // ==================== IDENTIDADE (espelha breakage.html) ====================
    const _rawPersonId = URL_PARAMS.get('person_id');
    const PERSON_ID_FROM_QUERY = (_rawPersonId && !_rawPersonId.includes('{{')) ? _rawPersonId : null;

    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }
    function decodeJwtPayload(jwt) {
      try {
        const parts = jwt.split('.');
        if (parts.length !== 3) return null;
        let p = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (p.length % 4) p += '=';
        return JSON.parse(atob(p));
      } catch (e) { return null; }
    }
    const ACCESS_TOKEN = getCookie('aAccessToken');
    const JWT_CLAIMS = ACCESS_TOKEN ? decodeJwtPayload(ACCESS_TOKEN) : null;
    const PERSON_ID_FROM_JWT = JWT_CLAIMS
      ? (JWT_CLAIMS.personId || JWT_CLAIMS.person_id || JWT_CLAIMS.sub || JWT_CLAIMS.userId || null)
      : null;
    const PERSON_ID = PERSON_ID_FROM_QUERY || PERSON_ID_FROM_JWT || null;
    const PERSON_ID_SOURCE = PERSON_ID_FROM_QUERY ? 'querystring'
                           : PERSON_ID_FROM_JWT ? 'jwt cookie' : 'none';

    function generateUuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }
    function getOrCreateSessionUuid() {
      try {
        const key = 'ifood_discovery_uuid';
        let id = localStorage.getItem(key);
        if (!id) { id = generateUuid(); localStorage.setItem(key, id); }
        return id;
      } catch (e) { return generateUuid(); }
    }
    const SESSION_UUID = getOrCreateSessionUuid();

    // ==================== BRIDGE ====================
    function callChannel(name, msg) {
      try {
        if (window[name] && typeof window[name].postMessage === 'function') {
          window[name].postMessage(typeof msg === 'string' ? msg : JSON.stringify(msg));
          return true;
        }
      } catch (e) {}
      return false;
    }

    function tryClose() {
      // Cascata recomendada pelo playbook
      if (callChannel('OnClose', 'close')) return true;
      if (!IS_ANDROID) {
        try { window.location.href = 'ifoodbenefits://inapp/home'; return true; } catch (e) {}
      }
      return false;
    }

    // ==================== TRACKING ====================
    function trackAmplitude(eventType, eventProperties) {
      if (!AMPLITUDE_API_KEY) return;
      const payload = {
        api_key: AMPLITUDE_API_KEY,
        events: [{
          user_id: PERSON_ID || SESSION_UUID,
          device_id: SESSION_UUID,
          event_type: eventType,
          event_properties: Object.assign({
            variant: VARIANT,
            page: PAGE,
            session_uuid: SESSION_UUID,
            person_id: PERSON_ID,
            person_id_source: PERSON_ID_SOURCE,
            platform: IS_ANDROID ? 'android' : 'ios_or_other',
            page_url: window.location.href,
            referrer: document.referrer || null
          }, eventProperties || {}),
          time: Date.now()
        }]
      };
      try {
        fetch('https://api2.amplitude.com/2/httpapi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true
        });
      } catch (e) {}
    }

    // ==================== OPÇÕES ====================
    function onOptionClick(option) {
      const cfg = DEEPLINKS[option] || {};
      trackAmplitude('ativado_option_click', {
        option: option,
        channel: cfg.channel || null,
        target: cfg.target || null,
        dispatched: !!(cfg.channel && cfg.target)
      });

      if (cfg.channel && cfg.target) {
        const ok = callChannel(cfg.channel, cfg.target);
        if (!ok) {
          // Fallback de teste fora do app: navegar pra própria URL como log
          console.warn('[ativado] canal indisponível:', cfg.channel, '→', cfg.target);
        }
      } else {
        console.warn('[ativado] deeplink ainda não configurado pra opção:', option);
      }
    }

    document.querySelectorAll('.option-card').forEach(btn => {
      btn.addEventListener('click', () => onOptionClick(btn.getAttribute('data-option')));
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      trackAmplitude('ativado_close_click');
      tryClose();
    });

    // Page view
    trackAmplitude('ativado_page_view');
  </script>
</body>
</html>
